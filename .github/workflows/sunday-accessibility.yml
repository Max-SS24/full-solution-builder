name: Sunday accessibility preferences

on:
  schedule:
    - cron: '17 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preference-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify display preferences across all application pages
        run: bunx vitest run src/test/app-routing.test.tsx src/lib/a11y-prefs.test.ts --testNamePattern='Weekly display preference persistence|display preferences' --reporter=default --reporter=junit --outputFile.junit=test-results/sunday-accessibility.xml
      - name: Keep weekly test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunday-accessibility-results
          path: test-results/sunday-accessibility.xml
          retention-days: 90